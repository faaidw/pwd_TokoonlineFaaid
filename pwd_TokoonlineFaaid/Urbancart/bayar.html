<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran | UrbanCart</title>

    <link rel="stylesheet" href="css/bayar.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="payment">

        <div class="card">

            <i class="fa-solid fa-credit-card"></i>

            <h1>Pembayaran</h1>

            <p>Total Pembayaran</p>

            <h1 id="paymentTotal">Rp0</h1>

            <hr>

            <h3>Transfer ke</h3>

            <div class="bank">

                <h4>BCA</h4>

                <p>1234567890</p>

                <small>a.n UrbanCart Indonesia</small>

            </div>

            <button onclick="location.href='berhasilbayar.html'">

                "bayarSekarang"

            </button>

        </div>

    </div>

    <script>

        const total = localStorage.getItem("checkoutTotal") || 0;

        document.getElementById("paymentTotal").innerHTML =
            "Rp" + Number(total).toLocaleString("id-ID");

    </script>

</body>

</html>
